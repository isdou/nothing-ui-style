<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLYPH UI — Component Demo</title>
  <link rel="stylesheet" href="./references/tokens.css" />
  <style>
    @font-face {
      font-family: "Doto";
      src: url("./assets/fonts/Doto[ROND,wght].ttf") format("truetype");
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: "Space Grotesk";
      src: url("./assets/fonts/SpaceGrotesk-Light.otf") format("opentype");
      font-weight: 300;
      font-display: swap;
    }
    @font-face {
      font-family: "Space Grotesk";
      src: url("./assets/fonts/SpaceGrotesk-Regular.otf") format("opentype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Space Grotesk";
      src: url("./assets/fonts/SpaceGrotesk-Medium.otf") format("opentype");
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: "Space Mono";
      src: url("./assets/fonts/SpaceMono-Regular.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Space Mono";
      src: url("./assets/fonts/SpaceMono-Bold.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 36px 24px;
      transition: background-color var(--duration-base) var(--ease-glide),
                  color var(--duration-base) var(--ease-glide);
    }

    .stage {
      width: 100%;
      max-width: 1040px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--glyph-fg);
    }

    .theme-switch {
      display: inline-flex;
      padding: 4px;
      background-color: var(--glyph-s2);
      border-radius: var(--radius-pill);
      gap: 4px;
    }

    .theme-switch button {
      padding: 7px 16px;
      border-radius: var(--radius-pill);
      border: none;
      background: transparent;
      color: var(--glyph-grey);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color var(--duration-fast) var(--ease-glide),
                  color var(--duration-fast) var(--ease-glide);
    }

    .theme-switch button.is-active {
      background-color: var(--glyph-fg);
      color: var(--glyph-ink);
    }

    /* Bento Grid */
    .bento {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--bento-gap);
    }

    .span-2 {
      grid-column: span 2;
    }

    .span-3 {
      grid-column: span 3;
    }

    .glyph-card {
      border: 1px solid var(--glyph-s3);
      min-height: 230px;
      transition: background-color var(--duration-base) var(--ease-glide),
                  border-color var(--duration-base) var(--ease-glide);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Clock Hero Card */
    .clock-card {
      background-color: var(--glyph-s1);
      padding: 28px 32px;
      min-height: 240px;
    }

    .clock-readout {
      display: flex;
      align-items: baseline;
      font-family: var(--font-dot);
      font-size: clamp(64px, 9vw, 112px);
      font-weight: 900;
      font-variation-settings: "ROND" 100, "wght" 900;
      line-height: 0.85;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      margin: 14px 0 18px;
    }

    .clock-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .greeting {
      font-size: 24px;
      font-weight: 300;
      letter-spacing: -0.02em;
    }

    .greeting span {
      color: var(--glyph-grey);
    }

    /* Ring Progress Card */
    .ring-wrap {
      position: relative;
      width: 156px;
      height: 156px;
      margin: 4px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--glyph-s3);
      transition: background-color 120ms var(--ease-glide);
    }

    .ring-dot.is-on {
      background-color: var(--glyph-fg);
    }

    .ring-center {
      text-align: center;
    }

    .ring-center .glyph-num {
      font-size: 36px;
    }

    .preset-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .preset-row .glyph-pill-btn {
      padding: 6px 12px;
      font-size: 11px;
      background-color: var(--glyph-s1);
    }

    .preset-row .glyph-pill-btn.is-active {
      background-color: var(--glyph-fg);
      color: var(--glyph-ink);
    }

    /* Segmented Sliders Card */
    .seg-group {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin: auto 0;
    }

    .seg-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .seg-row-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .seg-value {
      font-family: var(--font-dot);
      font-size: 28px;
      font-variation-settings: "ROND" 100, "wght" 900;
      line-height: 0.85;
      font-variant-numeric: tabular-nums;
    }

    .glyph-seg-interactive {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 5px;
      height: 18px;
      cursor: pointer;
      user-select: none;
    }

    .glyph-seg-interactive .glyph-seg-bar {
      height: 100%;
    }

    /* Media Card (One Live Red) */
    .media-body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: auto 0;
    }

    .matrix-viz {
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 4px;
      width: 100%;
      max-width: 240px;
    }

    .matrix-cell {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--glyph-s3);
      transition: background-color 110ms var(--ease-glide);
    }

    .matrix-cell.is-on {
      background-color: var(--glyph-fg);
    }

    .media-controls {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--glyph-s3);
      background: transparent;
      color: var(--glyph-fg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color var(--duration-fast) var(--ease-glide),
                  color var(--duration-fast) var(--ease-glide);
    }

    .icon-btn:hover {
      background-color: var(--glyph-fg);
      color: var(--glyph-ink);
    }

    .track-title {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    /* Toggles Card */
    .toggles-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: auto 0;
    }

    .glyph-toggle {
      flex: 1 1 200px;
      background-color: var(--glyph-s1);
    }

    @media (max-width: 820px) {
      .bento {
        grid-template-columns: 1fr;
      }
      .span-2, .span-3 {
        grid-column: span 1;
      }
      .media-body {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body class="glyph-canvas glyph-dot-grid">
  <main class="stage">
    <!-- Top Bar -->
    <header class="glyph-panel topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="glyph-label" style="color: var(--glyph-fg);">GLYPH // UI SYSTEM</span>
      </div>
      <div class="theme-switch" role="group" aria-label="Theme">
        <button id="btn-dark" class="is-active" type="button">DARK</button>
        <button id="btn-light" type="button">LIGHT</button>
      </div>
    </header>

    <!-- Bento Grid -->
    <section class="bento">
      <!-- 1. Clock & Hero (2 cols) -->
      <article class="glyph-card clock-card span-2">
        <div class="card-head">
          <span class="glyph-label" id="date-label">MONDAY · 24 NOV</span>
          <span class="glyph-label">LOCAL TIME</span>
        </div>
        <div class="clock-readout" aria-live="polite">
          <span id="clock-hh">00</span>
          <span class="glyph-blink">:</span>
          <span id="clock-mm">12</span>
        </div>
        <div class="clock-footer">
          <div class="greeting">Good evening, <span>Doudou.</span></div>
          <span class="glyph-label">BLACK · WHITE DOTS · ONE RED</span>
        </div>
      </article>

      <!-- 2. Ring LED Progress (1 col) -->
      <article class="glyph-card">
        <div class="card-head">
          <span class="glyph-label">BATTERY</span>
          <span class="glyph-label">44 LEDS</span>
        </div>
        <div class="ring-wrap" id="ring" aria-label="Ring progress">
          <div class="ring-center">
            <div class="glyph-num" id="ring-val">76%</div>
          </div>
        </div>
        <div class="preset-row" id="ring-presets">
          <button class="glyph-pill-btn" data-val="25" type="button">25</button>
          <button class="glyph-pill-btn is-active" data-val="76" type="button">76</button>
          <button class="glyph-pill-btn" data-val="100" type="button">100</button>
        </div>
      </article>

      <!-- 3. Segmented Bars (1 col) -->
      <article class="glyph-card">
        <div class="card-head">
          <span class="glyph-label">OUTPUT</span>
          <span class="glyph-label">CLICK BAR</span>
        </div>
        <div class="seg-group">
          <div class="seg-row">
            <div class="seg-row-head">
              <span class="glyph-label">VOLUME</span>
              <span class="seg-value" id="vol-num">67%</span>
            </div>
            <div class="glyph-seg-interactive" id="seg-vol" data-lit="8"></div>
          </div>
          <div class="seg-row">
            <div class="seg-row-head">
              <span class="glyph-label">BRIGHTNESS</span>
              <span class="seg-value" id="bri-num">83%</span>
            </div>
            <div class="glyph-seg-interactive" id="seg-bri" data-lit="10"></div>
          </div>
        </div>
      </article>

      <!-- 4. Media Player — The ONLY Red Element on Screen (2 cols) -->
      <article class="glyph-card span-2">
        <div class="card-head">
          <span class="glyph-label">NOW PLAYING</span>
          <span class="glyph-label" id="media-status">PLAYING</span>
        </div>
        <div class="media-body">
          <div>
            <div class="track-title" id="track-title">Midnight Matrix</div>
            <div class="glyph-label" id="track-artist" style="margin-top: 6px;">NOTHING SOUND LAB · 03:42</div>
          </div>
          <div class="matrix-viz" id="matrix-viz" aria-hidden="true"></div>
          <div class="media-controls">
            <button class="icon-btn" id="btn-prev" type="button" aria-label="Previous">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <!-- ONE LIVE RED -->
            <button class="glyph-live-btn" id="btn-play" type="button" aria-label="Play or Pause">
              <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 5h4v14H6zm8 0h4v14h-4z"/>
              </svg>
            </button>
            <button class="icon-btn" id="btn-next" type="button" aria-label="Next">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
            </button>
          </div>
        </div>
      </article>

      <!-- 5. Expanding Pill Toggles (3 cols) -->
      <article class="glyph-card span-3" style="min-height: 156px;">
        <div class="card-head">
          <span class="glyph-label">SYSTEM TOGGLES</span>
          <span class="glyph-label">GLIDE 350MS · ZERO OVERSHOOT</span>
        </div>
        <div class="toggles-grid">
          <button class="glyph-toggle" role="switch" aria-checked="true" type="button">
            <span class="glyph-toggle-track"></span>
            <span class="glyph-toggle-label">GLYPH EDGE</span>
          </button>
          <button class="glyph-toggle" role="switch" aria-checked="false" type="button">
            <span class="glyph-toggle-track"></span>
            <span class="glyph-toggle-label">NOISE CANCEL</span>
          </button>
          <button class="glyph-toggle" role="switch" aria-checked="true" type="button">
            <span class="glyph-toggle-track"></span>
            <span class="glyph-toggle-label">DOT MATRIX</span>
          </button>
        </div>
      </article>
    </section>
  </main>

  <script>
    // 1. Live Clock
    function updateClock() {
      const now = new Date();
      document.getElementById("clock-hh").textContent = String(now.getHours()).padStart(2, "0");
      document.getElementById("clock-mm").textContent = String(now.getMinutes()).padStart(2, "0");
      const days = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
      const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
      document.getElementById("date-label").textContent = `${days[now.getDay()]} · ${now.getDate()} ${months[now.getMonth()]}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // 2. Theme Switch
    const html = document.documentElement;
    const btnDark = document.getElementById("btn-dark");
    const btnLight = document.getElementById("btn-light");
    function setTheme(mode) {
      html.setAttribute("data-theme", mode);
      btnDark.classList.toggle("is-active", mode === "dark");
      btnLight.classList.toggle("is-active", mode === "light");
    }
    btnDark.addEventListener("click", () => setTheme("dark"));
    btnLight.addEventListener("click", () => setTheme("light"));

    // 3. 44-Dot Ring with 8ms Wave Delay
    const ringEl = document.getElementById("ring");
    const ringVal = document.getElementById("ring-val");
    const DOT_COUNT = 44;
    const ringDots = [];
    const radius = 68;
    for (let i = 0; i < DOT_COUNT; i++) {
      const dot = document.createElement("span");
      dot.className = "ring-dot";
      const angle = (i / DOT_COUNT) * Math.PI * 2 - Math.PI / 2;
      dot.style.left = `${78 + Math.cos(angle) * radius - 3}px`;
      dot.style.top = `${78 + Math.sin(angle) * radius - 3}px`;
      dot.style.transitionDelay = `${i * 8}ms`;
      ringEl.appendChild(dot);
      ringDots.push(dot);
    }

    function setRing(percent) {
      const lit = Math.round((percent / 100) * DOT_COUNT);
      ringVal.textContent = `${percent}%`;
      ringDots.forEach((d, i) => d.classList.toggle("is-on", i < lit));
    }
    setTimeout(() => setRing(76), 120);

    document.querySelectorAll("#ring-presets button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#ring-presets button").forEach((b) => b.classList.remove("is-active"));
        btn.classList.add("is-active");
        setRing(Number(btn.dataset.val));
      });
    });

    // 4. Interactive Segmented Bars
    function initSeg(el, numEl) {
      const count = 12;
      let lit = Number(el.dataset.lit || 6);
      const bars = [];
      for (let i = 0; i < count; i++) {
        const bar = document.createElement("span");
        bar.className = "glyph-seg-bar";
        bar.addEventListener("click", () => {
          lit = i + 1;
          render();
        });
        el.appendChild(bar);
        bars.push(bar);
      }
      function render() {
        bars.forEach((b, idx) => b.classList.toggle("is-on", idx < lit));
        numEl.textContent = `${Math.round((lit / count) * 100)}%`;
      }
      render();
    }
    initSeg(document.getElementById("seg-vol"), document.getElementById("vol-num"));
    initSeg(document.getElementById("seg-bri"), document.getElementById("bri-num"));

    // 5. Media Player + 16x6 Dot-Matrix Visualizer
    const vizEl = document.getElementById("matrix-viz");
    const cols = 16, rows = 6;
    const cells = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = document.createElement("span");
        cell.className = "matrix-cell";
        vizEl.appendChild(cell);
        cells.push({ el: cell, r, c });
      }
    }

    const tracks = [
      { title: "Midnight Matrix", artist: "NOTHING SOUND LAB · 03:42" },
      { title: "Pulse 01 (Monochrome)", artist: "GLYPH ARCHIVE · 04:15" },
      { title: "Doto Telemetry", artist: "NEBELUNG · 02:58" }
    ];
    let trackIdx = 0;
    let playing = true;
    const playIcon = document.getElementById("play-icon");
    const mediaStatus = document.getElementById("media-status");
    const trackTitle = document.getElementById("track-title");
    const trackArtist = document.getElementById("track-artist");

    function renderTrack() {
      trackTitle.textContent = tracks[trackIdx].title;
      trackArtist.textContent = tracks[trackIdx].artist;
    }

    document.getElementById("btn-play").addEventListener("click", () => {
      playing = !playing;
      mediaStatus.textContent = playing ? "PLAYING" : "PAUSED";
      playIcon.innerHTML = playing
        ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
        : '<path d="M8 5v14l11-7z"/>';
    });

    document.getElementById("btn-prev").addEventListener("click", () => {
      trackIdx = (trackIdx - 1 + tracks.length) % tracks.length;
      renderTrack();
    });

    document.getElementById("btn-next").addEventListener("click", () => {
      trackIdx = (trackIdx + 1) % tracks.length;
      renderTrack();
    });

    function tickViz() {
      const heights = Array.from({ length: cols }, (_, c) => {
        if (!playing) return 1;
        const wave = Math.sin(Date.now() / 220 + c * 0.55) * 0.5 + 0.5;
        return Math.max(1, Math.min(rows, Math.round(wave * rows * (0.45 + Math.random() * 0.65))));
      });
      cells.forEach(({ el, r, c }) => {
        const fromBottom = rows - 1 - r;
        el.classList.toggle("is-on", fromBottom < heights[c]);
      });
    }
    tickViz();
    setInterval(tickViz, 160);

    // 6. Expanding Pill Toggles
    document.querySelectorAll(".glyph-toggle").forEach((toggle) => {
      toggle.addEventListener("click", () => {
        const next = toggle.getAttribute("aria-checked") !== "true";
        toggle.setAttribute("aria-checked", String(next));
      });
    });
  </script>
</body>
</html>
